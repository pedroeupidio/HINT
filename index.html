<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HINT — Lobby</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f5;background:#171719}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,480px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:40px;letter-spacing:.12em;margin:0}small,.muted{color:#aaa}section{background:#252528;border-radius:18px;padding:20px;margin:12px 0}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;color:#c8c8c8;margin:14px 0 6px}input,select{width:100%;background:#343438;border:1px solid #55555a;border-radius:10px;padding:13px;color:white;font:inherit;outline:none}input:focus,select:focus{border-color:#22d3ee}button{background:#22d3ee;color:#111;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer;width:100%;margin-top:14px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#414147;color:white}.ghost{background:transparent;color:#ddd;border:1px solid #555}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.hidden{display:none!important}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#38383c}.team{border-left:4px solid var(--team);padding:10px 12px;margin:10px 0;background:#303034;border-radius:8px}.team strong{color:var(--team)}.player{padding:5px 0;color:#ddd}.status{min-height:22px;font-size:13px;color:#facc15;margin:12px 0;white-space:pre-wrap}.code{font-size:28px;font-weight:800;letter-spacing:.14em}.ready{color:#22d3ee}.help{font-size:12px;line-height:1.5;color:#aaa}.space{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body><main class="wrap">
<header><h1>HINT</h1><span class="pill" id="conn">Conectando...</span></header>
<div class="status" id="status" role="status"></div>
<section id="home"><h2>Entrar no HINT</h2><label for="name">Seu nome</label><input id="name" maxlength="24" placeholder="Nome do jogador" autocomplete="nickname"><label for="seat">Sua posição na ordem dos turnos</label><input id="seat" type="number" min="1" max="99" value="1"><label for="team">Sua equipe</label><select id="team"><option value="ciano">Ciano</option><option value="amarelo">Amarelo</option><option value="magenta">Magenta</option><option value="roxo">Roxo</option></select><button id="join">Entrar no jogo</button><p class="help">Todos entram na mesma sala. Cada jogador escolhe sua própria posição e equipe.</p><button class="ghost" id="resetHome">Reiniciar sala</button></section>
<section id="lobby" class="hidden"><div class="space"><h2>Sala de espera</h2><span class="pill" id="hostLabel"></span></div><div id="teams"></div><p class="help" id="validation"></p><button id="start" class="hidden">Iniciar partida</button><button id="leave" class="ghost">Sair / alterar dados</button><button id="resetLobby" class="ghost hidden">Reiniciar sala</button></section>
<section id="started" class="hidden"><h2>Partida iniciada!</h2><p class="muted">O lobby multiplayer está funcionando. O tabuleiro e as rodadas serão adicionados na próxima etapa.</p><button id="back" class="secondary">Voltar à tela inicial</button><button id="resetStarted" class="ghost hidden">Reiniciar sala (anfitrião)</button></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getDatabase,ref,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyD7r4jKw4pvVPSjLXOPWo5E81GPGr6agg0',authDomain:'hint-f025f.firebaseapp.com',databaseURL:'https://hint-f025f-default-rtdb.firebaseio.com',projectId:'hint-f025f',storageBucket:'hint-f025f.firebasestorage.app',messagingSenderId:'214671278513',appId:'1:214671278513:web:074769725659b9d68b3d90'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const ROOM=ref(db,'hint/sala'),$=id=>document.getElementById(id),colors={ciano:'#22d3ee',amarelo:'#facc15',magenta:'#f472b6',roxo:'#a78bfa'};
let uid=null,unsubscribe=null,busy=false,roomData=null,joined=false;
const say=(message='')=>$('status').textContent=message;
function screen(id){for(const x of ['home','lobby','started'])$(x).classList.toggle('hidden',x!==id)}
function errorMessage(e){const m=String(e?.message||e);if(/permission_denied|PERMISSION_DENIED/i.test(m))return 'Permissão negada. Verifique as regras do Realtime Database.';if(m.includes('auth/operation-not-allowed'))return 'Ative o login Anônimo no Firebase Authentication.';return m}
function details(){const name=$('name').value.trim(),seat=Number($('seat').value),team=$('team').value;if(!name||name.length>24)throw Error('Informe um nome de até 24 caracteres.');if(!Number.isInteger(seat)||seat<1||seat>99)throw Error('Escolha uma posição de 1 a 99.');return {name,seat,team}}
async function waitAuth(){if(uid)return uid;const user=auth.currentUser;if(user){uid=user.uid;return uid}const result=await signInAnonymously(auth);uid=result.user.uid;return uid}
function lock(flag){busy=flag;$('join').disabled=flag}
async function enter(){if(busy)return;lock(true);say('');try{await waitAuth();const info=details();let reason='';const tx=await runTransaction(ROOM,current=>{if(current?.status==='started'){reason='A partida já começou. Peça ao anfitrião para reiniciar a sala.';return}const players={...(current?.players||{})};if(Object.entries(players).some(([id,p])=>id!==uid&&Number(p.seat)===info.seat)){reason='Esta posição já está ocupada.';return}players[uid]=info;const host=current?.host&&players[current.host]?current.host:uid;return {host,status:'lobby',createdAt:current?.createdAt||Date.now(),players}},{applyLocally:false});if(!tx.committed)throw Error(reason||'Não foi possível entrar.');joined=true;subscribe();screen('lobby')}catch(e){say(errorMessage(e))}finally{lock(false)}}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=onValue(ROOM,snapshot=>{const data=snapshot.val();roomData=data;if(!data?.players?.[uid]){joined=false;screen('home');return}joined=true;if(data.status==='started'){screen('started');$('resetStarted').classList.toggle('hidden',data.host!==uid);return}screen('lobby');render(data)},e=>say(errorMessage(e)))}
function render(data){const host=data.host===uid;$('hostLabel').textContent=host?'Anfitrião':'Participante';$('resetLobby').classList.toggle('hidden',!host);const players=Object.entries(data.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);$('teams').replaceChildren();const used=[...new Set(players.map(p=>p.team))];for(const team of ['ciano','amarelo','magenta','roxo']){const members=players.filter(p=>p.team===team);if(!members.length)continue;const div=document.createElement('div');div.className='team';div.style.setProperty('--team',colors[team]);const heading=document.createElement('strong');heading.textContent=team[0].toUpperCase()+team.slice(1)+' ('+members.length+')';div.append(heading);for(const p of members){const el=document.createElement('div');el.className='player';el.textContent=`${p.seat} · ${p.name}${p.id===uid?' (você)':''}`;div.append(el)}$('teams').append(div)}const valid=used.length>=2&&used.length<=4&&used.every(t=>players.filter(p=>p.team===t).length>=2);$('validation').textContent=valid?'Equipes prontas para começar.':'É necessário ter de 2 a 4 equipes, com pelo menos 2 jogadores em cada.';$('start').classList.toggle('hidden',!host);$('start').disabled=!valid}
async function start(){if(busy)return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(!current||current.host!==uid||current.status!=='lobby')return;const players=Object.values(current.players||{}),teams=[...new Set(players.map(p=>p.team))];if(teams.length<2||teams.length>4||teams.some(t=>players.filter(p=>p.team===t).length<2))return;return {...current,status:'started',startedAt:Date.now()}},{applyLocally:false});if(!tx.committed)throw Error('Ainda não há jogadores suficientes ou a sala mudou.')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function leave(){if(busy)return;busy=true;say('');try{await runTransaction(ROOM,current=>{if(!current?.players?.[uid])return;const players={...current.players};delete players[uid];if(!Object.keys(players).length)return null;return {...current,players,host:current.host===uid?Object.keys(players)[0]:current.host}},{applyLocally:false});joined=false;screen('home')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function resetRoom(){if(busy)return;const canReset=roomData?.host===uid||!roomData||!Object.keys(roomData.players||{}).length;if(!canReset){say('Somente o anfitrião pode reiniciar uma sala ocupada.');return}if(!confirm('Reiniciar a sala? Todos os jogadores serão removidos.'))return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(current?.host&&current.host!==uid&&Object.keys(current.players||{}).length)return;return null},{applyLocally:false});if(!tx.committed)throw Error('A sala mudou. Somente o anfitrião pode reiniciá-la.');joined=false;roomData=null;screen('home');say('Sala reiniciada. Todos podem entrar novamente.')}catch(e){say(errorMessage(e))}finally{busy=false}}
$('join').onclick=enter;$('start').onclick=start;$('leave').onclick=leave;$('back').onclick=()=>{joined=false;screen('home')};for(const id of ['resetHome','resetLobby','resetStarted'])$(id).onclick=resetRoom;
onAuthStateChanged(auth,u=>{uid=u?.uid||null;$('conn').textContent=uid?'Conectado':'Conectando...';if(uid&&!unsubscribe)subscribe()});signInAnonymously(auth).catch(e=>say('Erro de autenticação: '+errorMessage(e)));
</script></body></html>
