<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HINT — Lobby</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f5;background:#171719}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,480px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:40px;letter-spacing:.12em;margin:0}small,.muted{color:#aaa}section{background:#252528;border-radius:18px;padding:20px;margin:12px 0}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;color:#c8c8c8;margin:14px 0 6px}input,select{width:100%;background:#343438;border:1px solid #55555a;border-radius:10px;padding:13px;color:white;font:inherit;outline:none}input:focus,select:focus{border-color:#22d3ee}button{background:#22d3ee;color:#111;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer;width:100%;margin-top:14px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#414147;color:white}.ghost{background:transparent;color:#ddd;border:1px solid #555}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.hidden{display:none!important}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#38383c}.team{border-left:4px solid var(--team);padding:10px 12px;margin:10px 0;background:#303034;border-radius:8px}.team strong{color:var(--team)}.player{padding:5px 0;color:#ddd}.status{min-height:22px;font-size:13px;color:#facc15;margin:12px 0;white-space:pre-wrap}.code{font-size:28px;font-weight:800;letter-spacing:.14em}.ready{color:#22d3ee}.help{font-size:12px;line-height:1.5;color:#aaa}.space{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body><main class="wrap">
<header><h1>HINT</h1><span class="pill" id="conn">Conectando...</span></header>
<div class="status" id="status" role="status"></div>
<section id="home"><h2>Entrar no jogo</h2><label for="name">Seu nome</label><input id="name" maxlength="24" placeholder="Nome do jogador" autocomplete="nickname"><label for="seat">Sua posição na ordem dos turnos</label><input id="seat" type="number" min="1" max="99" value="1"><label for="team">Sua equipe</label><select id="team"><option value="ciano">Ciano</option><option value="amarelo">Amarelo</option><option value="magenta">Magenta</option><option value="roxo">Roxo</option></select><button id="create">Criar sala</button><label for="roomCode">Código da sala</label><input id="roomCode" maxlength="6" placeholder="Ex.: ABC123" autocapitalize="characters"><button class="secondary" id="join">Entrar na sala</button><p class="help">Cada participante escolhe sua própria posição e equipe. Não é possível repetir posições.</p></section>
<section id="lobby" class="hidden"><div class="space"><h2>Sala de espera</h2><span class="pill" id="hostLabel"></span></div><div class="space"><span class="code" id="showCode"></span><button class="secondary" id="copy" style="width:auto;margin:0;padding:9px 12px">Copiar</button></div><div id="teams"></div><p class="help" id="validation"></p><button id="start" class="hidden">Iniciar partida</button><button id="leave" class="ghost">Sair da sala</button></section>
<section id="started" class="hidden"><h2>Partida iniciada!</h2><p class="muted">O lobby multiplayer está funcionando. O tabuleiro e as rodadas serão adicionados na próxima etapa.</p><p id="startedInfo"></p><button id="back" class="secondary">Voltar à tela inicial</button></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getDatabase,ref,get,onValue,runTransaction,remove} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyD7r4jKw4pvVPSjLXOPWo5E81GPGr6agg0',authDomain:'hint-f025f.firebaseapp.com',databaseURL:'https://hint-f025f-default-rtdb.firebaseio.com',projectId:'hint-f025f',storageBucket:'hint-f025f.firebasestorage.app',messagingSenderId:'214671278513',appId:'1:214671278513:web:074769725659b9d68b3d90'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id),colors={ciano:'#22d3ee',amarelo:'#facc15',magenta:'#f472b6',roxo:'#a78bfa'};
let uid=null,code=null,unsubscribe=null,busy=false,roomData=null;
const say=(message='')=>$('status').textContent=message;
function screen(id){for(const x of ['home','lobby','started'])$(x).classList.toggle('hidden',x!==id)}
function errorMessage(e){const m=String(e?.message||e);if(m.includes('PERMISSION_DENIED')||m.includes('permission_denied'))return 'Permissão negada. Verifique as regras do Realtime Database.';if(m.includes('auth/operation-not-allowed'))return 'Ative o login Anônimo no Firebase Authentication.';return m}
function details(){const name=$('name').value.trim(),seat=Number($('seat').value),team=$('team').value;if(!name||name.length>24)throw Error('Informe um nome de até 24 caracteres.');if(!Number.isInteger(seat)||seat<1||seat>99)throw Error('Escolha uma posição de 1 a 99.');return {name,seat,team}}
function generateCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>alphabet[Math.floor(Math.random()*alphabet.length)]).join('')}
async function waitAuth(){if(uid)return uid;await new Promise((resolve,reject)=>{const off=onAuthStateChanged(auth,u=>{if(u){uid=u.uid;off();resolve()}},reject)});return uid}
function lock(flag){busy=flag;$('create').disabled=flag;$('join').disabled=flag}
async function enter(create){if(busy)return;lock(true);say('');try{await waitAuth();const info=details();let room=create?generateCode():$('roomCode').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(room))throw Error('Informe um código de sala válido de 6 caracteres.');let reason='';const path=ref(db,'hint/'+room);const tx=await runTransaction(path,current=>{if(create){if(current){reason='Código ocupado. Tente criar novamente.';return}return {host:uid,status:'lobby',createdAt:Date.now(),players:{[uid]:info}}}if(!current){reason='Sala não encontrada.';return}if(current.status!=='lobby'){reason='Esta partida já começou.';return}const players=current.players||{};if(Object.entries(players).some(([id,p])=>id!==uid&&Number(p.seat)===info.seat)){reason='Esta posição já está ocupada.';return}return {...current,players:{...players,[uid]:info}}},{applyLocally:false});if(!tx.committed)throw Error(reason||'Não foi possível entrar na sala.');code=room;subscribe();screen('lobby')}catch(e){say(errorMessage(e))}finally{lock(false)}}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=onValue(ref(db,'hint/'+code),snapshot=>{const data=snapshot.val();if(!data){say('A sala foi encerrada.');reset();return}roomData=data;if(data.status==='started'){screen('started');$('startedInfo').textContent='Sala '+code;return}screen('lobby');render(data)},e=>say(errorMessage(e)))}
function render(data){$('showCode').textContent=code;const host=data.host===uid;$('hostLabel').textContent=host?'Anfitrião':'Participante';const players=Object.entries(data.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);$('teams').replaceChildren();const used=[...new Set(players.map(p=>p.team))];for(const team of ['ciano','amarelo','magenta','roxo']){const members=players.filter(p=>p.team===team);if(!members.length)continue;const div=document.createElement('div');div.className='team';div.style.setProperty('--team',colors[team]);const heading=document.createElement('strong');heading.textContent=team[0].toUpperCase()+team.slice(1)+' ('+members.length+')';div.append(heading);for(const p of members){const el=document.createElement('div');el.className='player';el.textContent=`${p.seat} · ${p.name}${p.id===uid?' (você)':''}`;div.append(el)}$('teams').append(div)}const valid=used.length>=2&&used.every(t=>players.filter(p=>p.team===t).length>=2);$('validation').textContent=valid?'Equipes prontas para começar.':'É necessário ter de 2 a 4 equipes, com pelo menos 2 jogadores em cada.';$('start').classList.toggle('hidden',!host);$('start').disabled=!valid}
async function start(){if(!code||busy)return;busy=true;say('');try{const tx=await runTransaction(ref(db,'hint/'+code),current=>{if(!current||current.host!==uid||current.status!=='lobby')return;const players=Object.values(current.players||{}),teams=[...new Set(players.map(p=>p.team))];if(teams.length<2||teams.length>4||teams.some(t=>players.filter(p=>p.team===t).length<2))return;return {...current,status:'started',startedAt:Date.now()}},{applyLocally:false});if(!tx.committed)throw Error('Ainda não há jogadores suficientes ou a sala mudou.')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function leave(){if(!code)return;const room=code;try{await runTransaction(ref(db,'hint/'+room),current=>{if(!current)return;const players={...(current.players||{})};delete players[uid];if(!Object.keys(players).length)return null;const host=current.host===uid?Object.keys(players)[0]:current.host;return {...current,host,players}},{applyLocally:false})}catch(e){say(errorMessage(e))}reset()}
function reset(){if(unsubscribe){unsubscribe();unsubscribe=null}code=null;roomData=null;screen('home')}
$('create').onclick=()=>enter(true);$('join').onclick=()=>enter(false);$('start').onclick=start;$('leave').onclick=leave;$('back').onclick=reset;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);say('Código copiado!')}catch{say('Copie o código exibido acima.')}};
onAuthStateChanged(auth,u=>{uid=u?.uid||null;$('conn').textContent=uid?'Conectado':'Conectando...'});signInAnonymously(auth).catch(e=>say('Erro de autenticação: '+errorMessage(e)));
</script></body></html>
