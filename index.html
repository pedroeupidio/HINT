<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HINT — Lobby</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f5;background:#171719}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,480px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:40px;letter-spacing:.12em;margin:0}small,.muted{color:#aaa}section{background:#252528;border-radius:18px;padding:20px;margin:12px 0}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;color:#c8c8c8;margin:14px 0 6px}input,select{width:100%;background:#343438;border:1px solid #55555a;border-radius:10px;padding:13px;color:white;font:inherit;outline:none}input:focus,select:focus{border-color:#22d3ee}button{background:#22d3ee;color:#111;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer;width:100%;margin-top:14px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#414147;color:white}.ghost{background:transparent;color:#ddd;border:1px solid #555}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.hidden{display:none!important}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#38383c}.team{border-left:4px solid var(--team);padding:10px 12px;margin:10px 0;background:#303034;border-radius:8px}.team strong{color:var(--team)}.player{padding:5px 0;color:#ddd}.status{min-height:22px;font-size:13px;color:#facc15;margin:12px 0;white-space:pre-wrap}.code{font-size:28px;font-weight:800;letter-spacing:.14em}.ready{color:#22d3ee}.help{font-size:12px;line-height:1.5;color:#aaa}.space{display:flex;justify-content:space-between;align-items:center;gap:8px}

#started{width:min(96vw,900px);max-width:none}body:has(#started:not(.hidden)){display:block;padding:12px}.wrap:has(#started:not(.hidden)){width:min(100%,960px)}
.board-area{position:relative;width:min(100%,760px);aspect-ratio:1;margin:auto}.board-svg{width:100%;height:100%;display:block}.board-card{position:absolute;width:20%;aspect-ratio:5/7;background:#202024;border-radius:9px;display:flex;flex-direction:column;justify-content:end;padding:2.3%;gap:4px;box-shadow:0 3px 14px #0005;overflow:hidden}.board-card strong{font-size:clamp(9px,1.8vw,16px);line-height:1.15}.board-card span{font-size:clamp(8px,1.3vw,12px);font-weight:800}.board-card.one{left:0;top:17%}.board-card.two{right:0;top:17%}.board-card.three{left:40%;bottom:0}.board-card{cursor:pointer;border:2px solid transparent}.board-card:focus-visible{outline:3px solid #22d3ee}.board-card:hover{border-color:#aaa}.board-card.locked{cursor:default;opacity:.65}.modal-backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:10}.modal-panel{background:#29292d;border-radius:18px;padding:22px;width:min(100%,420px);max-height:90dvh;overflow:auto}.modal-panel h2{margin-bottom:12px}.card-face{background:#f7f7f4;color:#222;border-radius:13px;padding:20px;margin:14px auto;max-width:300px;min-height:330px;display:flex;flex-direction:column;justify-content:center}.card-face.dark{background:#202024;color:#fff;justify-content:end;aspect-ratio:5/7}.card-face .forbidden{color:#bd2525;text-align:center;font-weight:800;padding-bottom:14px;border-bottom:1px solid #bbb}.card-face ol{padding-left:22px;line-height:1.8}.timer{font-size:38px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.board-help{text-align:center;font-size:12px;color:#aaa}.board-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.board-meta span{font-size:12px;color:#ddd}
</style>
</head>
<body><main class="wrap">
<header><h1>HINT</h1><span class="pill" id="conn">Conectando...</span></header>
<div class="status" id="status" role="status"></div>
<section id="home"><h2>Entrar no HINT</h2><label for="name">Seu nome</label><input id="name" maxlength="24" placeholder="Nome do jogador" autocomplete="nickname"><label for="seat">Sua posição na ordem dos turnos</label><input id="seat" type="number" min="1" max="99" value="1"><label for="team">Sua equipe</label><select id="team"><option value="ciano">Ciano</option><option value="amarelo">Amarelo</option><option value="magenta">Magenta</option><option value="roxo">Roxo</option></select><button id="join">Entrar no jogo</button><p class="help">Todos entram na mesma sala. Cada jogador escolhe sua própria posição e equipe.</p><button class="ghost" id="resetHome">Reiniciar sala</button></section>
<section id="lobby" class="hidden"><div class="space"><h2>Sala de espera</h2><span class="pill" id="hostLabel"></span></div><div id="teams"></div><p class="help" id="validation"></p><button id="start" class="hidden">Iniciar partida</button><button id="leave" class="ghost">Sair / alterar dados</button><button id="resetLobby" class="ghost hidden">Reiniciar sala</button></section>
<section id="started" class="hidden"><div class="board-meta"><h2>HINT — Tabuleiro</h2><span id="turnInfo">Aguardando turno</span></div><div class="board-area"><svg class="board-svg" id="board" viewBox="0 0 600 600" role="img" aria-label="Tabuleiro circular com 30 casas e cinco setores"></svg><div class="board-card one" data-slot="0" tabindex="0" role="button"></div><div class="board-card two" data-slot="1" tabindex="0" role="button"></div><div class="board-card three" data-slot="2" tabindex="0" role="button"></div></div><p class="board-help">Toque em uma carta para ver o tema. Somente o jogador da vez pode confirmar a escolha.</p><button id="back" class="secondary">Voltar à tela inicial</button><button id="resetStarted" class="ghost hidden">Reiniciar sala (anfitrião)</button></section>
</main><div id="modal" class="modal-backdrop hidden"><div class="modal-panel" id="modalContent"></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getDatabase,ref,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyD7r4jKw4pvVPSjLXOPWo5E81GPGr6agg0',authDomain:'hint-f025f.firebaseapp.com',databaseURL:'https://hint-f025f-default-rtdb.firebaseio.com',projectId:'hint-f025f',storageBucket:'hint-f025f.firebasestorage.app',messagingSenderId:'214671278513',appId:'1:214671278513:web:074769725659b9d68b3d90'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const ROOM=ref(db,'hint/sala'),$=id=>document.getElementById(id),colors={ciano:'#22d3ee',amarelo:'#facc15',magenta:'#f472b6',roxo:'#a78bfa'};
let uid=null,unsubscribe=null,busy=false,roomData=null,joined=false,selectedSlot=null;
const demoCards=[
 {theme:'Objetos de uma balada',mode:'DESENHO',color:'#facc15',answers:['Globo espelhado','Mesa de DJ','Copo de bebida','Pulseira de entrada','Máquina de fumaça','Caixa de som']},
 {theme:'Personagens de desenhos clássicos',mode:'MÍMICA',color:'#f472b6',answers:['Popeye','Pica-Pau','Scooby-Doo','Tom (Tom e Jerry)','Fred Flintstone','Jerry (Tom e Jerry)']},
 {theme:'Músicas de filmes famosos',mode:'CANTAROLAR',color:'#a78bfa',answers:['See You Again','(I’ve Had) The Time of My Life','Stayin’ Alive','You’ve Got a Friend in Me','Let It Go','Can You Feel the Love Tonight']}
];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playersSorted=d=>Object.entries(d?.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);
const turnPlayer=d=>playersSorted(d)[d?.turnIndex||0];
function closeModal(){selectedSlot=null;$('modal').classList.add('hidden')}
function showModal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}
function renderCards(data){document.querySelectorAll('.board-card').forEach((el,i)=>{const card=demoCards[i];el.innerHTML=`<strong>${esc(card.theme)}</strong><span style="color:${card.color}">${esc(card.mode)}</span>`;el.classList.toggle('locked',data.phase==='round'||turnPlayer(data)?.id!==uid)})}
function previewCard(slot){if(roomData?.phase==='round')return;const c=demoCards[slot],mine=turnPlayer(roomData)?.id===uid;selectedSlot=slot;showModal(`<h2>Escolher carta</h2><div class="card-face dark"><strong style="font-size:23px">${esc(c.theme)}</strong><b style="color:${c.color}">${esc(c.mode)}</b></div><p class="help">${mine?'Confirme para selecionar esta carta.':'Somente o jogador da vez pode escolher.'}</p>${mine?'<button id="confirmCard">Escolher carta</button>':''}<button class="secondary" id="cancelCard">Voltar</button>`);$('cancelCard').onclick=closeModal;if(mine)$('confirmCard').onclick=()=>chooseCard(slot)}
async function chooseCard(slot){try{const tx=await runTransaction(ROOM,d=>{if(!d||d.status!=='started'||d.phase==='round'||playersSorted(d)[d.turnIndex||0]?.id!==uid)return;return {...d,phase:'round',chosenSlot:slot,roundStartedAt:null,forbiddenIndex:Math.floor(Math.random()*6)}},{applyLocally:false});if(!tx.committed)throw Error('A carta não está mais disponível.');closeModal()}catch(e){say(errorMessage(e))}}
async function reveal(){try{const tx=await runTransaction(ROOM,d=>{if(d?.phase!=='round'||d.roundStartedAt||turnPlayer(d)?.id!==uid)return;return {...d,roundStartedAt:Date.now()}},{applyLocally:false});if(!tx.committed)throw Error('Não foi possível revelar.')}catch(e){say(errorMessage(e))}}
function renderRound(data){const p=turnPlayer(data),c=demoCards[data.chosenSlot??0],mine=p?.id===uid,started=!!data.roundStartedAt;const elapsed=started?Math.max(0,Math.floor((Date.now()-data.roundStartedAt)/1000)):0,remaining=Math.max(0,90-elapsed);const answers=c.answers.filter((_,i)=>i!==data.forbiddenIndex);const face=mine&&started?`<div class="card-face"><div class="forbidden">${esc(c.answers[data.forbiddenIndex])}</div><ol>${answers.map(a=>`<li>${esc(a)}</li>`).join('')}</ol></div>`:`<div class="card-face dark"><strong style="font-size:23px">${esc(c.theme)}</strong><b style="color:${c.color}">${esc(c.mode)}</b></div>`;showModal(`<h2>${esc(p?.name||'Jogador')} — ${esc(c.mode)}</h2><div class="timer" id="clock">${started?remaining+'s':'90s'}</div>${face}${mine&&!started?'<button id="reveal">Revelar respostas e iniciar 90s</button>':''}<p class="help">${started?(remaining?'Rodada em andamento.':'Tempo encerrado. A conferência será implementada na próxima etapa.'):'Aguardando o jogador da vez revelar as respostas.'}</p>`);if(mine&&!started)$('reveal').onclick=reveal}

const say=(message='')=>$('status').textContent=message;
function screen(id){for(const x of ['home','lobby','started'])$(x).classList.toggle('hidden',x!==id)}
function errorMessage(e){const m=String(e?.message||e);if(/permission_denied|PERMISSION_DENIED/i.test(m))return 'Permissão negada. Verifique as regras do Realtime Database.';if(m.includes('auth/operation-not-allowed'))return 'Ative o login Anônimo no Firebase Authentication.';return m}
function details(){const name=$('name').value.trim(),seat=Number($('seat').value),team=$('team').value;if(!name||name.length>24)throw Error('Informe um nome de até 24 caracteres.');if(!Number.isInteger(seat)||seat<1||seat>99)throw Error('Escolha uma posição de 1 a 99.');return {name,seat,team}}
async function waitAuth(){if(uid)return uid;const user=auth.currentUser;if(user){uid=user.uid;return uid}const result=await signInAnonymously(auth);uid=result.user.uid;return uid}
function lock(flag){busy=flag;$('join').disabled=flag}
async function enter(){if(busy)return;lock(true);say('');try{await waitAuth();const info=details();let reason='';const tx=await runTransaction(ROOM,current=>{if(current?.status==='started'){reason='A partida já começou. Peça ao anfitrião para reiniciar a sala.';return}const players={...(current?.players||{})};if(Object.entries(players).some(([id,p])=>id!==uid&&Number(p.seat)===info.seat)){reason='Esta posição já está ocupada.';return}players[uid]=info;const host=current?.host&&players[current.host]?current.host:uid;return {host,status:'lobby',createdAt:current?.createdAt||Date.now(),players}},{applyLocally:false});if(!tx.committed)throw Error(reason||'Não foi possível entrar.');joined=true;subscribe();screen('lobby')}catch(e){say(errorMessage(e))}finally{lock(false)}}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=onValue(ROOM,snapshot=>{const data=snapshot.val();roomData=data;if(!data?.players?.[uid]){joined=false;screen('home');return}joined=true;if(data.status==='started'){screen('started');$('resetStarted').classList.toggle('hidden',data.host!==uid);drawBoard(data);renderCards(data);if(data.phase==='round')renderRound(data);else closeModal();return}screen('lobby');render(data)},e=>say(errorMessage(e)))}
function render(data){const host=data.host===uid;$('hostLabel').textContent=host?'Anfitrião':'Participante';$('resetLobby').classList.toggle('hidden',!host);const players=Object.entries(data.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);$('teams').replaceChildren();const used=[...new Set(players.map(p=>p.team))];for(const team of ['ciano','amarelo','magenta','roxo']){const members=players.filter(p=>p.team===team);if(!members.length)continue;const div=document.createElement('div');div.className='team';div.style.setProperty('--team',colors[team]);const heading=document.createElement('strong');heading.textContent=team[0].toUpperCase()+team.slice(1)+' ('+members.length+')';div.append(heading);for(const p of members){const el=document.createElement('div');el.className='player';el.textContent=`${p.seat} · ${p.name}${p.id===uid?' (você)':''}`;div.append(el)}$('teams').append(div)}const valid=used.length>=2&&used.length<=4&&used.every(t=>players.filter(p=>p.team===t).length>=2);$('validation').textContent=valid?'Equipes prontas para começar.':'É necessário ter de 2 a 4 equipes, com pelo menos 2 jogadores em cada.';$('start').classList.toggle('hidden',!host);$('start').disabled=!valid}
async function start(){if(busy)return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(!current||current.host!==uid||current.status!=='lobby')return;const players=Object.values(current.players||{}),teams=[...new Set(players.map(p=>p.team))];if(teams.length<2||teams.length>4||teams.some(t=>players.filter(p=>p.team===t).length<2))return;return {...current,status:'started',startedAt:Date.now(),positions:Object.fromEntries(teams.map(t=>[t,0])),turnIndex:0,phase:'choose'}},{applyLocally:false});if(!tx.committed)throw Error('Ainda não há jogadores suficientes ou a sala mudou.')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function leave(){if(busy)return;busy=true;say('');try{await runTransaction(ROOM,current=>{if(!current?.players?.[uid])return;const players={...current.players};delete players[uid];if(!Object.keys(players).length)return null;return {...current,players,host:current.host===uid?Object.keys(players)[0]:current.host}},{applyLocally:false});joined=false;screen('home')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function resetRoom(){if(busy)return;const canReset=roomData?.host===uid||!roomData||!Object.keys(roomData.players||{}).length;if(!canReset){say('Somente o anfitrião pode reiniciar uma sala ocupada.');return}if(!confirm('Reiniciar a sala? Todos os jogadores serão removidos.'))return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(current?.host&&current.host!==uid&&Object.keys(current.players||{}).length)return;return null},{applyLocally:false});if(!tx.committed)throw Error('A sala mudou. Somente o anfitrião pode reiniciá-la.');joined=false;roomData=null;screen('home');say('Sala reiniciada. Todos podem entrar novamente.')}catch(e){say(errorMessage(e))}finally{busy=false}}

function drawBoard(data){
 const svg=$('board'),NS='http://www.w3.org/2000/svg';svg.replaceChildren();
 const make=(tag,attrs={},label)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(label!==undefined)el.textContent=label;svg.append(el);return el};
 const cx=300,cy=284,rad=Math.PI/180;
 const point=(r,a)=>[cx+r*Math.cos(a*rad),cy+r*Math.sin(a*rad)];
 const wedge=(r,a,b)=>{const p=point(r,a),q=point(r,b);return `M ${cx} ${cy} L ${p[0]} ${p[1]} A ${r} ${r} 0 0 1 ${q[0]} ${q[1]} Z`};
 // Setores: a ordem progride no sentido horario; setor 5 e ciano.
 for(let i=0;i<5;i++)make('path',{d:wedge(167,-90+i*72,-90+(i+1)*72),fill:i===4?'#22d3ee':'#252528',stroke:'#fff','stroke-width':2});
 for(let i=0;i<30;i++){
   const a=-90+i*12,b=a+12,outerA=point(194,a),outerB=point(194,b),innerA=point(174,a),innerB=point(174,b);
   const d=`M ${innerA[0]} ${innerA[1]} L ${outerA[0]} ${outerA[1]} A 194 194 0 0 1 ${outerB[0]} ${outerB[1]} L ${innerB[0]} ${innerB[1]} A 174 174 0 0 0 ${innerA[0]} ${innerA[1]} Z`;
   make('path',{d,fill:Math.floor(i/6)===4?'#22d3ee':'#303034',stroke:'#fff','stroke-width':1.5});
 }
 // Simbolos: seta no primeiro setor; bonus nos setores 4 e 5.
 for(const [i,symbol] of [[0,'➜'],[3,'+1'],[4,'+1']]){const p=point(101,-54+i*72);make('text',{x:p[0],y:p[1]+8,'text-anchor':'middle',fill:i===4?'#202024':'#fff','font-size':i===0?32:28,'font-weight':800},symbol)}
 const active=[...new Set(Object.values(data.players||{}).map(p=>p.team))];
 active.forEach((team,j)=>{const pos=Math.max(0,Math.min(29,Number(data.positions?.[team]||0)));const a=-90+(pos+.5)*12,p=point(184,a);const spread=active.filter(t=>Number(data.positions?.[t]||0)===pos);const idx=spread.indexOf(team);make('circle',{cx:p[0]+(idx-(spread.length-1)/2)*8,cy:p[1],r:5.5,fill:colors[team],stroke:'#171719','stroke-width':1.5})});
 const players=Object.values(data.players||{}).sort((a,b)=>a.seat-b.seat);
 $('turnInfo').textContent=players.length?`Vez de: ${players[data.turnIndex||0]?.name||players[0].name}`:'';
}

document.querySelectorAll('.board-card').forEach(el=>{const fn=()=>previewCard(Number(el.dataset.slot));el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})});setInterval(()=>{if(roomData?.status==='started'&&roomData.phase==='round'&&roomData.roundStartedAt){const clock=$('clock');if(clock){const remain=Math.max(0,90-Math.floor((Date.now()-roomData.roundStartedAt)/1000));clock.textContent=remain+'s'}}},300);$('join').onclick=enter;$('start').onclick=start;$('leave').onclick=leave;$('back').onclick=()=>{joined=false;screen('home')};for(const id of ['resetHome','resetLobby','resetStarted'])$(id).onclick=resetRoom;
onAuthStateChanged(auth,u=>{uid=u?.uid||null;$('conn').textContent=uid?'Conectado':'Conectando...';if(uid&&!unsubscribe)subscribe()});signInAnonymously(auth).catch(e=>say('Erro de autenticação: '+errorMessage(e)));
</script></body></html>
