const MODE_COLORS={FALA:colors.ciano,DESENHO:colors.amarelo,"MÍMICA":colors.magenta,CANTAROLAR:colors.roxo};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playersSorted=d=>Object.entries(d?.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);
const turnPlayer=d=>playersSorted(d)[d?.turnIndex||0];
function closeModal(){selectedSlot=null;$('modal').classList.add('hidden')}
function showModal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}
function cardFor(d,slot){const id=d?.slots?.[slot]?.id;return CARD_CATALOG.find(c=>c.id===id)}
function teamOrder(d){return [...new Set(playersSorted(d).map(p=>p.team))]}
function nextPlayer(d){const ps=playersSorted(d),current=turnPlayer(d);for(let i=1;i<ps.length;i++){const candidate=ps[(Number(d.turnIndex||0)+i)%ps.length];if(candidate.team!==current?.team)return candidate}return ps[0]}
function phaseOwner(d){return turnPlayer(d)?.id===uid}
function cardBack(c){return `<div class="card-face dark"><strong style="font-size:23px">${esc(c.theme)}</strong><b style="color:${MODE_COLORS[c.mode]}">${esc(c.mode)}</b></div>`}
function remaining(d){return Math.max(0,90-Math.floor((Date.now()-(d.roundStartedAt||Date.now()))/1000))}
function answersOf(d){const c=cardFor(d,d.chosenSlot);const forbidden=d.forbidden?.[c.id]??0;return {c,forbidden,valid:c.answers.map((answer,index)=>({answer,index})).filter(a=>a.index!==forbidden)}}
function teamInMandatorySector(d){
 const team=turnPlayer(d)?.team;
 const pos=Math.max(0,Number(d.positions?.[team]||0));
 return pos>=24&&pos<30;
}
function mandatorySlot(d){
 return d.slots?.findIndex(x=>x.sector===5)??-1;
}
function renderCards(d){
 const mandatory=mandatorySlot(d),forced=mandatory>=0&&!teamInMandatorySector(d);
 document.querySelectorAll('.board-card').forEach((el,i)=>{
  const slot=d.slots?.[i],c=cardFor(d,i);
  el.classList.toggle('hidden',!c);
  if(!c||!slot)return;
  // As cartas seguem fisicamente seus setores (1 a 5), sem girar ou deformar.
  const angle=(-90+(slot.sector-.5)*72)*Math.PI/180;
  const radius=40;
  el.style.left=`${50+radius*Math.cos(angle)}%`;
  el.style.top=`${47.33+radius*Math.sin(angle)}%`;
  const isMandatory=slot.sector===5;
  const unavailable=forced&&!isMandatory;
  el.classList.toggle('mandatory',isMandatory);
  el.classList.toggle('unavailable',unavailable);
  el.setAttribute('aria-disabled',String(d.phase!=='choose'||!phaseOwner(d)||unavailable));
  el.innerHTML=`<strong>${esc(c.theme)}</strong><span style="color:${MODE_COLORS[c.mode]}">${esc(c.mode)}</span>`;
  el.classList.toggle('locked',d.phase!=='choose'||!phaseOwner(d));
 });
 const score=$('scoreboard');
 score.innerHTML=teamOrder(d).map(t=>`<span class="scorechip" style="color:${colors[t]}">${esc(t)}: <b>${Number(d.positions?.[t]||0)}</b>/30</span>`).join('');
 $('boardHelp').textContent=d.phase==='choose'?(forced?'Carta no setor ciano: escolha obrigatória.':'Toque em uma carta. Apenas o jogador da vez pode confirmar.'):'A rodada está em andamento.';
}
function previewCard(slot){if(roomData?.phase!=='choose')return;const c=cardFor(roomData,slot);if(!c)return;const mine=phaseOwner(roomData);const forced=mandatorySlot(roomData)>=0&&!teamInMandatorySector(roomData);if(forced&&roomData.slots[slot].sector!==5){say('A carta do setor ciano é obrigatória nesta rodada.');return;}selectedSlot=slot;showModal(`<h2>Escolher carta</h2>${cardBack(c)}<p class="help">${mine?'Confirme a escolha para continuar.':'Somente o jogador da vez pode escolher.'}</p>${mine?'<button id="confirmCard">Escolher carta</button>':''}<button class="secondary" id="cancelCard">Voltar</button>`);$('cancelCard').onclick=closeModal;if(mine)$('confirmCard').onclick=()=>chooseCard(slot)}
async function updateRoom(fn,error='A sala mudou. Tente novamente.'){try{const tx=await runTransaction(ROOM,d=>{if(!d||d.status!=='started')return;return fn(d)},{applyLocally:false});if(!tx.committed)throw Error(error)}catch(e){say(errorMessage(e))}}
async function chooseCard(slot){closeModal();await updateRoom(d=>{if(d.phase!=='choose'||turnPlayer(d)?.id!==uid||!d.slots?.[slot])return;const sector=d.slots[slot].sector;const ownInFive=teamInMandatorySector(d);const forced=d.slots.some(x=>x.sector===5)&&!ownInFive;if(forced&&sector!==5)return;return {...d,phase:'waitingReveal',chosenSlot:slot,roundStartedAt:null,marks:null,guess:null} },'Esta carta não pode ser escolhida agora.')}
async function reveal(){await updateRoom(d=>{if(d.phase!=='waitingReveal'||turnPlayer(d)?.id!==uid)return;return {...d,phase:'round',roundStartedAt:Date.now()}})}
async function finishRound(){await updateRoom(d=>{if(d.phase!=='round'||turnPlayer(d)?.id!==uid)return;return {...d,phase:'review'}})}
function renderRound(d){const {c,forbidden,valid}=answersOf(d),p=turnPlayer(d),mine=phaseOwner(d),started=d.phase==='round',rem=remaining(d);const show=mine&&(d.phase==='round'||d.phase==='review');const face=show?`<div class="card-face"><div class="forbidden">${esc(c.answers[forbidden])}</div><ol>${valid.map(x=>`<li>${esc(x.answer)}</li>`).join('')}</ol></div>`:cardBack(c);const timer=started?`<div class="timer" id="clock">${rem}s</div>`:'';showModal(`<h2>${esc(p?.name||'Jogador')} — ${esc(c.mode)}</h2>${timer}${face}${mine&&d.phase==='waitingReveal'?'<button id="reveal">Revelar respostas e iniciar 90s</button>':''}${mine&&started?'<button id="finish">Encerrar rodada</button>':''}<p class="help">${d.phase==='waitingReveal'?'Aguardando a revelação.':started?(rem?'Rodada em andamento.':'Tempo esgotado.'):'Aguardando conferência.'}</p>`);if(mine&&d.phase==='waitingReveal')$('reveal').onclick=reveal;if(mine&&started)$('finish').onclick=finishRound}
function renderReview(d){const {c,forbidden,valid}=answersOf(d),mine=phaseOwner(d);if(!mine){showModal(`<h2>Conferência</h2>${cardBack(c)}<p class="help">Aguardando o jogador responsável registrar as respostas.</p>`);return}const marks=d.marks||{valid:[],forbidden:false};showModal(`<h2>Conferir respostas</h2><p class="help">Marque somente o que foi dito durante os 90 segundos.</p><label class="choice" style="color:#ff7979"><input type="checkbox" id="markForbidden" ${marks.forbidden?'checked':''}>Proibida mencionada: <b>${esc(c.answers[forbidden])}</b></label>${valid.map((x,i)=>`<label class="choice"><input type="checkbox" class="validMark" data-i="${i}" ${marks.valid.includes(i)?'checked':''}>${esc(x.answer)}</label>`).join('')}<button id="saveMarks">Confirmar conferência</button>`);$('saveMarks').onclick=async()=>{const checked=[...document.querySelectorAll('.validMark:checked')].map(x=>Number(x.dataset.i)),bad=$('markForbidden').checked;await updateRoom(x=>{if(x.phase!=='review'||turnPlayer(x)?.id!==uid)return;return {...x,phase:'guess',marks:{valid:checked,forbidden:bad}}})}}
function renderGuess(d){const {c,forbidden,valid}=answersOf(d),p=nextPlayer(d),mine=p?.id===uid,marks=d.marks||{valid:[],forbidden:false};const remainingValid=valid.filter((x,i)=>!marks.valid.includes(i));const forbiddenAvailable=!marks.forbidden;const available=remainingValid.length+(forbiddenAvailable?1:0);if(!available){if(roomData?.host===uid)skipGuess();showModal('<h2>Sem tentativa adversária</h2><p>Todas as seis respostas foram mencionadas. Preparando pontuação...</p>');return}showModal(`<h2>Tentativa adversária</h2>${cardBack(c)}<p class="help">Equipe seguinte: <b style="color:${colors[p.team]}">${esc(p.team)}</b> — ${esc(p.name)}. A tentativa é verbal, sem revelar as respostas.</p>${mine?'<button id="guessValid">Tentar resposta válida (+1 / −1)</button>':''}${mine&&forbiddenAvailable?'<button id="guessForbidden" class="secondary">Tentar resposta proibida (+2 / −2)</button>':''}${mine?'<button id="passGuess" class="ghost">Passar a vez</button>':''}${!mine?'<p class="notice">Aguardando a equipe adversária escolher a tentativa.</p>':''}`);if(mine){$('guessValid').onclick=()=>selectGuess('valid');if(forbiddenAvailable)$('guessForbidden').onclick=()=>selectGuess('forbidden');$('passGuess').onclick=()=>submitGuess('pass',false)}}
function selectGuess(type){showModal(`<h2>Resultado da tentativa</h2><p>Após a tentativa verbal, o jogador que deu as dicas confirma se acertou.</p><p class="notice">${type==='valid'?'Resposta válida não mencionada':'Resposta proibida não mencionada'}</p><button id="guessCorrect">Acertou</button><button class="secondary" id="guessWrong">Errou</button><button class="ghost" id="guessBack">Voltar</button>`);$('guessCorrect').onclick=()=>submitGuess(type,true);$('guessWrong').onclick=()=>submitGuess(type,false);$('guessBack').onclick=()=>renderGuess(roomData)}
async function submitGuess(type,correct){await updateRoom(d=>{if(d.phase!=='guess'||nextPlayer(d)?.id!==uid)return;const {valid}=answersOf(d),marks=d.marks||{valid:[],forbidden:false};if(type==='forbidden'&&marks.forbidden)return;if(type==='valid'&&valid.every((_,i)=>marks.valid.includes(i)))return;return {...d,phase:'result',guess:{type,correct}}})}
async function skipGuess(){await updateRoom(d=>{if(d.phase!=='guess'||d.host!==uid)return;const {valid}=answersOf(d),m=d.marks||{valid:[],forbidden:false};if(!m.forbidden||m.valid.length!==valid.length)return;return {...d,phase:'result',guess:{type:'pass',correct:false}}})}
function roundScore(d){const {c}=answersOf(d),marks=d.marks||{valid:[],forbidden:false},sector=d.slots[d.chosenSlot].sector;const earned=marks.valid.length-(marks.forbidden?2:0)+(sector>=4?1:0);const guess=d.guess||{type:'pass'},delta=guess.type==='pass'?0:guess.type==='valid'?(guess.correct?1:-1):(guess.correct?2:-2);return {earned,delta,team:turnPlayer(d).team,other:nextPlayer(d).team}}
function renderResult(d){const {earned,delta,team,other}=roundScore(d);const mine=d.host===uid;showModal(`<h2>Resultado da rodada</h2><div class="scoreline"><span>${esc(team)}</span><b>${earned>=0?'+':''}${earned}</b></div><div class="scoreline"><span>${esc(other)} (tentativa)</span><b>${delta>=0?'+':''}${delta}</b></div>${mine?'<button id="applyScore">Aplicar pontos e continuar</button>':'<p class="help">Aguardando o anfitrião aplicar os pontos.</p>'}`);if(mine)$('applyScore').onclick=applyScore}
function advanceSlots(d){const chosen=d.chosenSlot,old=d.slots||[];let slots=old.filter((_,i)=>i!==chosen).map(x=>({...x,sector:Math.min(5,x.sector+1)}));const remaining=(d.deck||[]).filter(id=>!slots.some(x=>x.id===id));if(remaining.length)slots.push({id:remaining[0],sector:1});return {slots:slots.sort((a,b)=>a.sector-b.sector),deck:remaining.slice(1)}}
async function applyScore(){await updateRoom(d=>{if(d.phase!=='result'||d.host!==uid)return;const {earned,delta,team,other}=roundScore(d),positions={...d.positions};positions[team]=Math.max(0,Math.min(30,(positions[team]||0)+earned));positions[other]=Math.max(0,Math.min(30,(positions[other]||0)+delta));const winner=Object.entries(positions).filter(([,v])=>v>=30).map(([t])=>t);const moved=advanceSlots(d);return {...d,...moved,positions,turnIndex:(Number(d.turnIndex||0)+1)%playersSorted(d).length,phase:winner.length?'finished':'choose',winner:winner[0]||null,chosenSlot:null,roundStartedAt:null,marks:null,guess:null}})}
function renderFinished(d){showModal(`<h2>Fim de jogo!</h2><div style="text-align:center;font-size:26px;color:${colors[d.winner]}">🏆 Equipe ${esc(d.winner)} venceu!</div><p class="help">A equipe alcançou 30 pontos.</p>${d.host===uid?'<button id="restartGame">Nova partida com os mesmos jogadores</button>':''}`);if(d.host===uid)$('restartGame').onclick=restartGame}
function initialDeck(){return CARD_CATALOG.map(c=>c.id).sort(()=>Math.random()-.5)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function freshGame(d){const deck=shuffle(CARD_CATALOG.map(c=>c.id));return {...d,status:'started',startedAt:Date.now(),positions:Object.fromEntries(teamOrder(d).map(t=>[t,0])),turnIndex:0,phase:'choose',slots:[{id:deck[0],sector:1},{id:deck[1],sector:2},{id:deck[2],sector:3}],deck:deck.slice(3),forbidden:Object.fromEntries(CARD_CATALOG.map(c=>[c.id,Math.floor(Math.random()*6)])),winner:null,chosenSlot:null,roundStartedAt:null,marks:null,guess:null}}
async function restartGame(){await updateRoom(d=>{if(d.host!==uid||d.phase!=='finished')return;return freshGame(d)})}
function renderPhase(d){if(d.phase==='choose'){closeModal();return}if(d.phase==='waitingReveal'||d.phase==='round'){renderRound(d);return}if(d.phase==='review'){renderReview(d);return}if(d.phase==='guess'){renderGuess(d);return}if(d.phase==='result'){renderResult(d);return}if(d.phase==='finished')renderFinished(d)}
const say=(message='')=>$('status').textContent=message;
function screen(id){for(const x of ['home','lobby','started'])$(x).classList.toggle('hidden',x!==id)}
function errorMessage(e){const m=String(e?.message||e);if(/permission_denied|PERMISSION_DENIED/i.test(m))return 'Permissão negada. Verifique as regras do Realtime Database.';if(m.includes('auth/operation-not-allowed'))return 'Ative o login Anônimo no Firebase Authentication.';return m}
function details(){const name=$('name').value.trim(),seat=Number($('seat').value),team=$('team').value;if(!name||name.length>24)throw Error('Informe um nome de até 24 caracteres.');if(!Number.isInteger(seat)||seat<1||seat>99)throw Error('Escolha uma posição de 1 a 99.');return {name,seat,team}}
async function waitAuth(){if(uid)return uid;const user=auth.currentUser;if(user){uid=user.uid;return uid}const result=await signInAnonymously(auth);uid=result.user.uid;return uid}
function lock(flag){busy=flag;$('join').disabled=flag}
async function enter(){if(busy)return;lock(true);say('');try{await waitAuth();const info=details();let reason='';const tx=await runTransaction(ROOM,current=>{if(current?.status==='started'){reason='A partida já começou. Peça ao anfitrião para reiniciar a sala.';return}const players={...(current?.players||{})};if(Object.entries(players).some(([id,p])=>id!==uid&&Number(p.seat)===info.seat)){reason='Esta posição já está ocupada.';return}players[uid]=info;const host=current?.host&&players[current.host]?current.host:uid;return {host,status:'lobby',createdAt:current?.createdAt||Date.now(),players}},{applyLocally:false});if(!tx.committed)throw Error(reason||'Não foi possível entrar.');joined=true;subscribe();screen('lobby')}catch(e){say(errorMessage(e))}finally{lock(false)}}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=onValue(ROOM,snapshot=>{const data=snapshot.val();roomData=data;if(!data?.players?.[uid]){joined=false;screen('home');return}joined=true;if(data.status==='started'){screen('started');$('resetStarted').classList.toggle('hidden',data.host!==uid);drawBoard(data);renderCards(data);renderPhase(data);return}screen('lobby');render(data)},e=>say(errorMessage(e)))}
function render(data){const host=data.host===uid;$('hostLabel').textContent=host?'Anfitrião':'Participante';$('resetLobby').classList.toggle('hidden',!host);const players=Object.entries(data.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.seat-b.seat);$('teams').replaceChildren();const used=[...new Set(players.map(p=>p.team))];for(const team of ['ciano','amarelo','magenta','roxo']){const members=players.filter(p=>p.team===team);if(!members.length)continue;const div=document.createElement('div');div.className='team';div.style.setProperty('--team',colors[team]);const heading=document.createElement('strong');heading.textContent=team[0].toUpperCase()+team.slice(1)+' ('+members.length+')';div.append(heading);for(const p of members){const el=document.createElement('div');el.className='player';el.textContent=`${p.seat} · ${p.name}${p.id===uid?' (você)':''}`;div.append(el)}$('teams').append(div)}const valid=used.length>=2&&used.length<=4&&used.every(t=>players.filter(p=>p.team===t).length>=2);$('validation').textContent=valid?'Equipes prontas para começar.':'É necessário ter de 2 a 4 equipes, com pelo menos 2 jogadores em cada.';$('start').classList.toggle('hidden',!host);$('start').disabled=!valid}
async function start(){if(busy)return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(!current||current.host!==uid||current.status!=='lobby')return;const players=Object.values(current.players||{}),teams=[...new Set(players.map(p=>p.team))];if(teams.length<2||teams.length>4||teams.some(t=>players.filter(p=>p.team===t).length<2))return;return freshGame(current)},{applyLocally:false});if(!tx.committed)throw Error('Ainda não há jogadores suficientes ou a sala mudou.')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function leave(){if(busy)return;busy=true;say('');try{await runTransaction(ROOM,current=>{if(!current?.players?.[uid])return;const players={...current.players};delete players[uid];if(!Object.keys(players).length)return null;return {...current,players,host:current.host===uid?Object.keys(players)[0]:current.host}},{applyLocally:false});joined=false;screen('home')}catch(e){say(errorMessage(e))}finally{busy=false}}
async function resetRoom(){if(busy)return;const canReset=roomData?.host===uid||!roomData||!Object.keys(roomData.players||{}).length;if(!canReset){say('Somente o anfitrião pode reiniciar uma sala ocupada.');return}if(!confirm('Reiniciar a sala? Todos os jogadores serão removidos.'))return;busy=true;say('');try{const tx=await runTransaction(ROOM,current=>{if(current?.host&&current.host!==uid&&Object.keys(current.players||{}).length)return;return null},{applyLocally:false});if(!tx.committed)throw Error('A sala mudou. Somente o anfitrião pode reiniciá-la.');joined=false;roomData=null;screen('home');say('Sala reiniciada. Todos podem entrar novamente.')}catch(e){say(errorMessage(e))}finally{busy=false}}

function drawBoard(data){
 const svg=$('board'),NS='http://www.w3.org/2000/svg';svg.replaceChildren();
 const make=(tag,attrs={},label)=>{const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(label!==undefined)el.textContent=label;svg.append(el);return el};
 const cx=300,cy=284,rad=Math.PI/180;
 const point=(r,a)=>[cx+r*Math.cos(a*rad),cy+r*Math.sin(a*rad)];
 const wedge=(r,a,b)=>{const p=point(r,a),q=point(r,b);return `M ${cx} ${cy} L ${p[0]} ${p[1]} A ${r} ${r} 0 0 1 ${q[0]} ${q[1]} Z`};
 // Setores: a ordem progride no sentido horario; setor 5 e ciano.
 for(let i=0;i<5;i++)make('path',{d:wedge(167,-90+i*72,-90+(i+1)*72),fill:i===4?'#22d3ee':'#252528',stroke:'#fff','stroke-width':2});
 for(let i=0;i<30;i++){
   const a=-90+i*12,b=a+12,outerA=point(194,a),outerB=point(194,b),innerA=point(174,a),innerB=point(174,b);
   const d=`M ${innerA[0]} ${innerA[1]} L ${outerA[0]} ${outerA[1]} A 194 194 0 0 1 ${outerB[0]} ${outerB[1]} L ${innerB[0]} ${innerB[1]} A 174 174 0 0 0 ${innerA[0]} ${innerA[1]} Z`;
   make('path',{d,fill:Math.floor(i/6)===4?'#22d3ee':'#303034',stroke:'#fff','stroke-width':1.5});
 }
 // Simbolos: seta no primeiro setor; bonus nos setores 4 e 5.
 for(const [i,symbol] of [[0,'➜'],[3,'+1'],[4,'+1']]){const p=point(101,-54+i*72);make('text',{x:p[0],y:p[1]+8,'text-anchor':'middle',fill:i===4?'#202024':'#fff','font-size':i===0?32:28,'font-weight':800},symbol)}
 const active=[...new Set(Object.values(data.players||{}).map(p=>p.team))];
 active.forEach((team,j)=>{const pos=Math.max(0,Math.min(29,Number(data.positions?.[team]||0)));const a=-90+(pos+.5)*12,p=point(184,a);const spread=active.filter(t=>Number(data.positions?.[t]||0)===pos);const idx=spread.indexOf(team);make('circle',{cx:p[0]+(idx-(spread.length-1)/2)*8,cy:p[1],r:5.5,fill:colors[team],stroke:'#171719','stroke-width':1.5})});
 const players=Object.values(data.players||{}).sort((a,b)=>a.seat-b.seat);
 $('turnInfo').textContent=players.length?`Vez de: ${players[data.turnIndex||0]?.name||players[0].name}`:'';
}

document.querySelectorAll('.board-card').forEach(el=>{const fn=()=>previewCard(Number(el.dataset.slot));el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})});setInterval(()=>{const d=roomData;if(d?.status!=='started')return;if(d.phase==='round'&&d.roundStartedAt){const rem=remaining(d),clock=$('clock');if(clock)clock.textContent=rem+'s';if(rem===0&&d.host===uid)updateRoom(x=>x.phase==='round'&&remaining(x)===0?{...x,phase:'review'}:undefined)}if(d.phase==='guess'&&d.host===uid){const {valid}=answersOf(d),m=d.marks||{valid:[],forbidden:false};if(m.forbidden&&m.valid.length===valid.length)skipGuess()}},500);$('join').onclick=enter;$('start').onclick=start;$('leave').onclick=leave;$('back').onclick=()=>{joined=false;screen('home')};for(const id of ['resetHome','resetLobby','resetStarted'])$(id).onclick=resetRoom;
onAuthStateChanged(auth,u=>{uid=u?.uid||null;$('conn').textContent=uid?'Conectado':'Conectando...';if(uid&&!unsubscribe)subscribe()});signInAnonymously(auth).catch(e=>say('Erro de autenticação: '+errorMessage(e)));
</script></body></html>
